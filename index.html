<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>メニュー表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>メニュー一覧</h1>

  <!-- メニューのボタンを表示する場所 -->
  <div id="menu"></div>

  <h3>合計金額: <span id="total">0</span>円</h3>
  <h4>税込価格: <span id="tax-included">0</span>円</h4>
  
<div>
  <label><input type="radio" name="tax-rate" value="0.05"> 5%</label>
  <label><input type="radio" name="tax-rate" value="0.08" checked> 8%</label>
  <label><input type="radio" name="tax-rate" value="0.10"> 10%</label>
</div>
  
  <button onclick="reset()">リセット</button>

  <!-- 注文リスト -->
  <h3>注文リスト:</h3>
  <ul id="orderList"></ul>

  <!-- JavaScriptファイルを読み込む -->
  <script src="script.js"></script>
</body>
</html>
